<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thông tin người dùng</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>Thông tin người dùng</h1>

        <p class="description">
            Nhập tên người dùng để xem thông tin
        </p>


        <div class="form">

            <label for="name">
                Tên người dùng
            </label>

            <input type="text" id="name" placeholder="Ví dụ: USaD">

            <button onclick="getUser()">
                Xem thông tin
            </button>

        </div>


        <div id="result" class="result">

            <p>
                Chưa có thông tin người dùng.
            </p>

        </div>

    </div>


    <script>
        async function getUser() {

            const nameInput = document.getElementById("name");

            const result = document.getElementById("result");

            const name = nameInput.value.trim();


            if (name === "") {

                result.innerHTML = `
                    <p class="error">
                        Vui lòng nhập tên.
                    </p>
                `;

                return;
            }


            try {

                const response = await fetch(
                    "/api/user?name=" + encodeURIComponent(name)
                );


                const data = await response.json();


                if (response.ok) {

                    result.innerHTML = `

                        <h2>Thông tin người dùng</h2>

                        <p>
                            <strong>Tên:</strong>
                            ${data.name}
                        </p>

                        <p>
                            <strong>Email:</strong>
                            ${data.email}
                        </p>

                        <p>
                            <strong>Nghề nghiệp:</strong>
                            ${data.job}
                        </p>

                    `;

                } else {

                    result.innerHTML = `

                        <p class="error">
                            ${data.error}
                        </p>

                    `;
                }

            } catch (error) {

                result.innerHTML = `

                    <p class="error">
                        Không thể kết nối đến server.
                    </p>

                `;

                console.error(error);
            }
        }
    </script>

</body>

</html>
