server.address=127.0.0.1
server.port=${LOCAL_APP_PORT:8081}

spring.datasource.url=jdbc:mysql://${LOCAL_DB_HOST:127.0.0.1}:${LOCAL_DB_PORT:3306}/${LOCAL_DB_NAME:banhangonline_local}?sslMode=DISABLED&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${LOCAL_DB_USERNAME:root}
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${LOCAL_DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.flyway.enabled=false

app.cookie.secure=false
app.cors.allowed-origins=${LOCAL_FRONTEND_ORIGINS:}
app.otp.hash-secret=${LOCAL_OTP_HASH_SECRET:}
app.storage.s3.enabled=false
app.storage.local.enabled=true
