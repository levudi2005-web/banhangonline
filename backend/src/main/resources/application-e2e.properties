spring.application.name=ban-hang-online-e2e
server.address=127.0.0.1
server.port=${E2E_APP_PORT:8081}

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/banhangonline_e2e?sslMode=DISABLED&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${E2E_DB_USERNAME}
spring.datasource.password=${E2E_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.flyway.enabled=false

app.cookie.secure=false
