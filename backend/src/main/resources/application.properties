spring.application.name=ban-hang-online
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.cookie.name=SID
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}
app.cors.allowed-origins=${FRONTEND_ORIGINS:}
app.frontend.base-url=${FRONTEND_BASE_URL:}
app.session.ttl-hours=8
app.session.remember-days=30
app.reset-token.ttl-minutes=30
app.rate-limit.max-attempts=10
app.rate-limit.window-seconds=60
