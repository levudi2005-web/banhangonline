spring.application.name=ban-hang-online
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=${DB_SSL_MODE}&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

app.cookie.name=SID
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAMESITE:Lax}
app.cors.allowed-origins=${FRONTEND_ORIGINS:}
app.session.ttl-hours=8
app.session.remember-days=30
app.reset-token.ttl-minutes=30
app.rate-limit.max-attempts=10
app.rate-limit.window-seconds=60
app.otp.expiration-seconds=${OTP_EXPIRATION_SECONDS:300}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:5}
app.otp.max-sends-per-day=${OTP_MAX_SENDS_PER_DAY:10}
app.otp.hash-secret=${OTP_HASH_SECRET:${RESEND_API_KEY:}}

app.storage.s3.enabled=${S3_ENABLED:false}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
