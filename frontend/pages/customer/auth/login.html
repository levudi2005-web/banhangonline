<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../../assets/css/style.css">
  <link rel="stylesheet" href="../../../assets/css/auth.css">
  <title>Đăng nhập — Cửa hàng</title>
</head>

<body class="customer">
  <main class="auth">

    <!-- ===== Form đăng nhập ===== -->
    <section class="panel">
      <div class="card auth-card">

        <div class="auth-header">
          <a class="brand" data-route="gateway" href="/pages/auth/index.html">
            <span class="logo"><i data-i="bag"></i></span>
            Cửa hàng
          </a>
        </div>

        <h1>Chào mừng trở lại</h1>
        <p class="sub">Đăng nhập để tiếp tục mua sắm</p>

        <form data-endpoint="/api/auth/login"
              data-login-role="CUSTOMER"
              novalidate>

          <div class="row">
            <!-- Tài khoản -->
            <div class="field">
              <label for="account">Tài khoản</label>
              <input id="account"
                     name="account"
                     autocomplete="username"
                     placeholder="Email / Số điện thoại / Tên đăng nhập"
                     data-v="required"
                     data-required-message="Vui lòng nhập tài khoản.">
              <small class="required-hint">Thông tin bắt buộc</small>
              <p class="err"></p>
            </div>

            <!-- Mật khẩu -->
            <div class="field">
              <label for="password">Mật khẩu</label>
              <div class="pw">
                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       placeholder="Nhập mật khẩu"
                       data-v="required"
                       data-required-message="Vui lòng nhập mật khẩu.">
                <button type="button" class="eye" aria-label="Hiện mật khẩu">
                  <i data-i="eye"></i>
                </button>
              </div>
              <small class="required-hint">Thông tin bắt buộc</small>
              <p class="err"></p>
            </div>
          </div>

          <!-- Ghi nhớ + Quên mật khẩu -->
          <div class="between">
            <label class="chk">
              <input type="checkbox" name="remember"> Ghi nhớ đăng nhập
            </label>
            <a data-route="customer.forgot" href="forgot-password.html">Quên mật khẩu?</a>
          </div>

          <p class="form-msg" role="alert"></p>

          <button class="btn" type="submit">Đăng nhập</button>
        </form>

        <p class="center">
          Chưa có tài khoản? <a data-route="customer.register" href="register.html"><b>Đăng ký ngay</b></a>
        </p>

        <!-- Chuyển sang đăng nhập quản trị -->
        <a class="switch" data-route="gateway" href="/pages/auth/index.html">
          <span class="ic"><i data-i="shield"></i></span>
          <span>
            <b>Bạn là chủ cửa hàng hoặc nhân viên?</b>
            <small>Chọn đúng khu vực đăng nhập</small>
          </span>
          <i data-i="right"></i>
        </a>

      </div>
    </section>

  </main>

  <script src="../../../assets/js/core/routes.js"></script>
  <script src="../../../assets/js/core/app.js"></script>
</body>
</html>
