<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/css/style.css"><title>Đặt lại mật khẩu — Khách hàng</title></head>
<body class="customer"><main class="auth"><section class="panel"><div class="card auth-card">
<div class="auth-header"><a class="back" data-route="customer.login" href="/pages/customer/auth/login.html">← Quay lại đăng nhập</a></div><h1>Đặt mật khẩu mới</h1><p class="sub">Tạo mật khẩu mới sau khi xác minh thông tin tài khoản.</p>
<form data-endpoint="/api/auth/reset-password" data-next-route="customer.login" data-next-query="reset=success" data-success="Mật khẩu đã được cập nhật. Đang chuyển tới trang đăng nhập…" novalidate>
<input type="hidden" name="token">
<div class="row">
<div class="field"><label for="newPassword">Mật khẩu mới</label><div class="pw"><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" data-v="required min8" data-required-message="Thông tin bắt buộc"><button type="button" class="eye" aria-label="Hiện mật khẩu"><i data-i="eye"></i></button></div><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<div class="field"><label for="confirmPassword">Xác nhận mật khẩu</label><div class="pw"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" data-v="required match:newPassword" data-required-message="Thông tin bắt buộc"><button type="button" class="eye" aria-label="Hiện mật khẩu"><i data-i="eye"></i></button></div><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
</div>
<p class="form-msg" role="alert"></p><button class="btn" type="submit">Cập nhật mật khẩu</button></form>
</div></section></main><script src="../../../assets/js/core/routes.js"></script><script src="../../../assets/js/core/app.js"></script></body></html>
