<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/css/style.css"><title>Quên mật khẩu — Khách hàng</title></head>
<body class="customer"><main class="auth"><section class="panel"><div class="card">
<a class="back" href="/pages/customer/auth/login.html">← Quay lại đăng nhập</a><h1>Quên mật khẩu</h1>
<p class="sub">Nhận mã xác minh qua email hoặc số điện thoại đã đăng ký.</p>
<form data-endpoint="/api/auth/otp/send" data-otp-send data-otp-followup="#otpVerify" novalidate>
<input type="hidden" name="purpose" value="RESET_PASSWORD">
<div class="field"><label for="channel">Kênh nhận mã</label><select id="channel" name="channel" data-v="required"><option value="EMAIL">Email</option><option value="SMS">SMS</option></select><p class="err"></p></div>
<div class="field"><label for="destination">Email hoặc số điện thoại</label><input id="destination" name="destination" autocomplete="email tel" data-v="required" data-required-message="Vui lòng nhập email hoặc số điện thoại."><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<p class="form-msg" role="alert"></p><button class="btn" type="submit">Gửi mã xác minh</button></form>
<form id="otpVerify" data-endpoint="/api/auth/otp/verify" data-otp-verify data-reset-page="/pages/customer/auth/reset-password.html" hidden novalidate>
<input type="hidden" name="purpose" value="RESET_PASSWORD"><input type="hidden" name="channel"><input type="hidden" name="destination">
<div class="field"><label for="code">Mã xác minh</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-v="required" data-required-message="Vui lòng nhập mã."><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<p class="form-msg" role="alert"></p><button class="btn" type="submit">Xác minh và tiếp tục</button></form>
</div></section><aside class="visual"><h2>Khôi phục quyền truy cập</h2><p>Mã chỉ dùng một lần và sẽ hết hạn sau vài phút.</p></aside></main><script src="../../../assets/js/core/app.js"></script></body></html>
