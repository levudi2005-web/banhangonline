<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/css/dashboard.css">
  <title>Cửa hàng — BanHangOnline</title>
</head>
<body class="dashboard">
  <main class="dash-shell">
    <header class="dash-top">
      <a class="dash-brand" href="/pages/customer/index.html">BanHangOnline</a>
      <nav class="dash-nav" aria-label="Điều hướng khách hàng">
        <a href="/pages/customer/index.html" aria-current="page">Cửa hàng</a>
        <a href="#category-filter">Danh mục</a>
        <a href="/pages/customer/cart.html">Giỏ hàng</a>
        <a href="/pages/customer/orders.html">Đơn hàng</a>
        <a href="/pages/customer/notifications.html">Thông báo</a>
        <a href="/pages/auth/session.html?area=customer">Tài khoản</a>
      </nav>
    </header>
    <h1 class="dash-title">Nhận hàng tại cửa hàng</h1>
    <p class="dash-subtitle">Khám phá sản phẩm, chọn cửa hàng nhận hàng và đặt trực tuyến dễ dàng.</p>
    <section class="dash-card">
      <div class="shop-heading" id="products">
        <div>
          <h2>Chọn cửa hàng nhận hàng</h2>
          <p class="dash-muted">Sản phẩm và tồn kho được cập nhật trực tiếp từ cửa hàng.</p>
        </div>
        <a class="dash-button secondary" href="/pages/customer/cart.html">Mở giỏ hàng</a>
      </div>
      <div id="store-status" class="dash-status" role="status" aria-live="polite">Đang tải cửa hàng…</div>
      <div class="dash-field"><label for="store-select">Cửa hàng</label><select id="store-select"></select></div>
      <div class="shop-toolbar">
        <div class="dash-field">
          <label for="product-search">Tìm sản phẩm</label>
          <input id="product-search" type="search" placeholder="Tên, mô tả hoặc mã hàng">
        </div>
        <div class="dash-field">
          <label for="category-filter">Danh mục</label>
          <select id="category-filter"><option value="">Tất cả danh mục</option></select>
        </div>
        <div class="dash-field">
          <label for="product-sort">Sắp xếp</label>
          <select id="product-sort">
            <option value="recommended">Mặc định</option>
            <option value="price-asc">Giá thấp đến cao</option>
            <option value="price-desc">Giá cao đến thấp</option>
            <option value="name">Tên A–Z</option>
          </select>
        </div>
        <span id="product-count" class="dash-muted" aria-live="polite"></span>
      </div>
      <div id="product-list" class="shop-grid" aria-live="polite"></div>
    </section>
  </main>
  <script src="../../assets/js/core/routes.js"></script>
  <script src="../../assets/js/features/customer-home.js"></script>
</body>
</html>
