<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/css/style.css"><title>Quên mật khẩu — Cửa hàng</title></head>
<body class="staff"><main class="auth"><aside class="visual"><h2>Khôi phục tài khoản cửa hàng</h2><p>Xác minh bằng thông tin điện thoại đã đăng ký.</p></aside><section class="panel"><div class="card">
<a class="back" href="/pages/staff/auth/login.html">← Quay lại đăng nhập quản trị</a><h1>Quên mật khẩu</h1><p class="sub">Nhập tài khoản và bốn số cuối của số điện thoại đã đăng ký.</p>
<form data-endpoint="/api/auth/forgot-password" data-reset-request data-reset-page="/pages/staff/auth/reset-password.html" novalidate>
<div class="row">
<div class="field"><label for="account">Email / Tên đăng nhập / Số điện thoại</label><input id="account" name="account" autocomplete="username" data-v="required" data-required-message="Thông tin bắt buộc"><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<div class="field"><label for="phoneLastFour">Bốn số cuối điện thoại</label><input id="phoneLastFour" name="phoneLastFour" inputmode="numeric" autocomplete="off" maxlength="4" data-v="required phoneLastFour" data-required-message="Thông tin bắt buộc"><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
</div>
<p class="form-msg" role="alert" aria-live="polite"></p><button class="btn" type="submit">Xác minh</button></form>
</div></section></main><script src="../../../assets/js/core/app.js"></script></body></html>
