<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/css/style.css"><title>Quên mật khẩu — Cửa hàng</title></head>
<body class="staff"><main class="auth"><aside class="visual"><h2>Khôi phục tài khoản cửa hàng</h2><p>Mã OTP chỉ dùng một lần và có thời hạn.</p></aside><section class="panel"><div class="card">
<a class="back" href="/pages/staff/auth/login.html">← Quay lại đăng nhập quản trị</a><h1>Quên mật khẩu</h1><p class="sub">Nhập email đăng ký để nhận mã OTP đặt lại mật khẩu.</p>
<form data-endpoint="/api/auth/otp/send" data-otp-send data-otp-followup="#otpVerify" data-otp-mask="#maskedEmail" novalidate>
<input type="hidden" name="channel" value="EMAIL"><input type="hidden" name="purpose" value="RESET_PASSWORD">
<div class="field"><label for="email">Email</label><input id="email" name="destination" type="email" autocomplete="email" data-v="required email" data-required-message="Thông tin bắt buộc"><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<p class="form-msg" role="alert" aria-live="polite"></p><button class="btn" type="submit">Gửi mã OTP</button></form>
<form id="otpVerify" data-endpoint="/api/auth/otp/verify" data-otp-verify data-reset-page="/pages/staff/auth/reset-password.html" hidden novalidate>
<input type="hidden" name="channel" value="EMAIL"><input type="hidden" name="purpose" value="RESET_PASSWORD"><input type="hidden" name="destination">
<p class="sub">Mã đã được yêu cầu cho <strong id="maskedEmail"></strong>.</p>
<div class="field"><label for="code">Mã OTP</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-v="required otp" data-required-message="Thông tin bắt buộc"><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<p class="otp-countdown" data-otp-countdown role="status" aria-live="polite"></p><p class="form-msg" role="alert" aria-live="polite"></p>
<button class="btn" type="submit">Xác nhận</button><button class="btn ghost" type="button" data-otp-resend disabled>Gửi lại mã</button></form>
</div></section></main><script src="../../../assets/js/core/app.js"></script></body></html>
