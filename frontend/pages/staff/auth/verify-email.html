<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../assets/css/style.css"><title>Xác minh email — Cửa hàng</title></head>
<body class="staff"><main class="auth"><aside class="visual"><h2>Xác minh tài khoản cửa hàng</h2><p>Hoàn tất xác minh trước khi chờ duyệt đăng ký.</p></aside><section class="panel"><div class="card">
<a class="back" href="/pages/staff/auth/register.html">← Quay lại đăng ký</a><h1>Xác minh email</h1>
<form data-endpoint="/api/auth/otp/send" data-otp-send data-otp-followup="#otpVerify" data-otp-mask="#maskedEmail" novalidate>
<input type="hidden" name="channel" value="EMAIL"><input type="hidden" name="purpose" value="REGISTER_EMAIL">
<div class="field"><label for="email">Email chủ cửa hàng</label><input id="email" name="destination" type="email" autocomplete="email" data-otp-prefill="email" data-v="required email" data-required-message="Thông tin bắt buộc"><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<p class="form-msg" role="alert" aria-live="polite"></p><button class="btn" type="submit">Gửi mã OTP</button></form>
<form id="otpVerify" data-endpoint="/api/auth/otp/verify" data-otp-verify hidden novalidate>
<input type="hidden" name="channel" value="EMAIL"><input type="hidden" name="purpose" value="REGISTER_EMAIL"><input type="hidden" name="destination">
<p class="sub">Mã đã được yêu cầu cho <strong id="maskedEmail"></strong>.</p>
<div class="field"><label for="code">Mã OTP</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-v="required otp" data-required-message="Thông tin bắt buộc"><small class="required-hint">Thông tin bắt buộc</small><p class="err"></p></div>
<p class="otp-countdown" data-otp-countdown role="status" aria-live="polite"></p><p class="form-msg" role="alert" aria-live="polite"></p>
<button class="btn" type="submit">Xác minh email</button><button class="btn ghost" type="button" data-otp-resend disabled>Gửi lại mã</button></form>
<p class="note">Sau khi xác minh email, tài khoản cửa hàng vẫn cần được quản trị viên duyệt.</p></div></section></main><script src="../../../assets/js/core/app.js"></script></body></html>
