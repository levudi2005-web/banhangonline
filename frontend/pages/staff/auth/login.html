<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../../../assets/css/style.css">

  <title>Đăng nhập quản trị — Cửa hàng</title>
  <link rel="stylesheet" href="../../../assets/css/auth.css">
</head>

<body class="staff staff-login">

  <main class="auth">

    <section class="panel">

      <div class="card auth-card">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="auth-header">

          <a
            class="back"
            data-route="gateway"
            href="/pages/auth/index.html"
          >
            <i data-i="left"></i>
            <span>Quay lại chọn khu vực</span>
          </a>

          <span class="management-badge">
            Quản trị cửa hàng
          </span>

        </div>

        <!-- =================================================
             HEADING
        ================================================== -->

        <div class="login-heading">

          <div class="login-heading-main">

            <h1 id="management-login-title">
              Đăng nhập quản trị
            </h1>

            <p
              id="management-login-description"
              class="sub"
            >
              Dành cho chủ cửa hàng hoặc nhân viên đã được cấp tài khoản.
            </p>

          </div>

          <div class="secure-chip">

            <span class="secure-chip-icon">
              <i data-i="lock"></i>
            </span>

            <span>
              Phiên đăng nhập bảo mật
            </span>

          </div>

        </div>

        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
          data-endpoint="/api/auth/staff/login"
          data-login-role="MANAGEMENT"
          novalidate
        >

          <div class="row">

            <!-- ACCOUNT -->

            <div class="field">

              <label for="account">
                Tài khoản
              </label>

              <input
                id="account"
                name="account"
                autocomplete="username"
                placeholder="Email / Số điện thoại / Tên đăng nhập"
                data-v="required"
                data-required-message="Vui lòng nhập tài khoản."
              >

              <small class="required-hint">
                Thông tin bắt buộc
              </small>

              <p class="err"></p>

            </div>

            <!-- PASSWORD -->

            <div class="field">

              <label for="password">
                Mật khẩu
              </label>

              <div class="pw">

                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Nhập mật khẩu"
                  data-v="required"
                  data-required-message="Vui lòng nhập mật khẩu."
                >

                <button
                  type="button"
                  class="eye"
                  aria-label="Hiện mật khẩu"
                >
                  <i data-i="eye"></i>
                </button>

              </div>

              <small class="required-hint">
                Thông tin bắt buộc
              </small>

              <p class="err"></p>

            </div>

          </div>

          <!-- OPTIONS -->

          <div class="between">

            <label class="chk">

              <input
                type="checkbox"
                name="remember"
              >

              <span>
                Ghi nhớ đăng nhập
              </span>

            </label>

            <a
              data-route="staff.forgot"
              href="forgot-password.html"
            >
              Quên mật khẩu?
            </a>

          </div>

          <!-- FORM MESSAGE -->

          <p
            class="form-msg"
            role="alert"
          ></p>

          <!-- SUBMIT -->

          <button
            class="btn"
            type="submit"
          >
            Đăng nhập
          </button>

        </form>

        <!-- =================================================
             INFORMATION
        ================================================== -->

        <p
          class="center"
          style="margin-top:18px"
        >
          Tài khoản cửa hàng được cấp bởi quản trị viên.
        </p>

        <p class="lockline">

          <i data-i="lock"></i>

          <span>
            Chỉ dành cho tài khoản được cấp quyền
          </span>

        </p>

      </div>

    </section>

  </main>

  <!-- =======================================================
       EXISTING APPLICATION SCRIPTS
  ======================================================== -->

  <script src="../../../assets/js/core/routes.js"></script>
  <script src="../../../assets/js/core/app.js"></script>

</body>
</html>
