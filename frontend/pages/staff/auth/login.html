<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../../../assets/css/style.css">

  <title>Đăng nhập quản trị — Cửa hàng</title>

  <style>
    /* =========================================================
       BANHANGONLINE — STAFF / MANAGEMENT LOGIN
       Premium modern / clean / responsive
       Không thay đổi API, route, validation hoặc JS
    ========================================================= */

    body.staff-login {
      --staff-accent: #2563eb;
      --staff-accent-dark: #1d4ed8;
      --staff-accent-soft: #eff6ff;

      --staff-ink: #111827;
      --staff-text: #334155;
      --staff-muted: #64748b;
      --staff-placeholder: #94a3b8;

      --staff-line: #e2e8f0;
      --staff-line-soft: #edf1f5;

      --staff-bg: #f7f9fc;
      --staff-card: #ffffff;
      --staff-input: #fbfdff;

      --staff-danger: #dc2626;
      --staff-success: #047857;

      min-height: 100vh;
      margin: 0;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(37, 99, 235, .06),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(59, 130, 246, .045),
          transparent 30%
        ),
        var(--staff-bg);

      color: var(--staff-ink);
    }

    /* =========================================================
       PAGE
    ========================================================= */

    body.staff-login .auth {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: clamp(18px, 4vw, 52px);
    }

    body.staff-login .panel {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       CARD
    ========================================================= */

    body.staff-login .auth-card {
      position: relative;
      width: min(100%, 920px);

      overflow: hidden;

      padding: 32px 36px 28px;

      border: 1px solid rgba(15, 23, 42, .075);
      border-radius: 30px;

      background: rgba(255, 255, 255, .97);

      box-shadow:
        0 26px 80px rgba(15, 23, 42, .08),
        0 8px 24px rgba(15, 23, 42, .035);

      animation:
        staff-card-enter .42s cubic-bezier(.2, .8, .2, 1);
    }

    body.staff-login .auth-card::before {
      content: "";

      position: absolute;
      inset: 0 0 auto 0;

      height: 3px;

      background:
        linear-gradient(
          90deg,
          #2563eb 0%,
          #60a5fa 52%,
          #bfdbfe 100%
        );
    }

    @keyframes staff-card-enter {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================================================
       HEADER
    ========================================================= */

    body.staff-login .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin-bottom: 28px;
    }

    body.staff-login .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin: 0;
      padding: 8px 12px 8px 8px;

      border-radius: 12px;

      color: var(--staff-muted);

      font-size: 13px;
      font-weight: 650;

      text-decoration: none;

      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    body.staff-login .back i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    body.staff-login .back:hover {
      color: var(--staff-ink);
      background: #f1f5f9;
      text-decoration: none;
      transform: translateX(-2px);
    }

    body.staff-login .management-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 12px;

      border: 1px solid #dbeafe;
      border-radius: 999px;

      background: var(--staff-accent-soft);
      color: var(--staff-accent-dark);

      font-size: 10.5px;
      line-height: 1;
      font-weight: 800;

      letter-spacing: .08em;
      text-transform: uppercase;

      white-space: nowrap;
    }

    body.staff-login .management-badge::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .10);
    }

    /* =========================================================
       HEADING
    ========================================================= */

    body.staff-login .login-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 28px;

      margin-bottom: 30px;
    }

    body.staff-login .login-heading-main {
      min-width: 0;
    }

    body.staff-login h1 {
      margin: 0 0 9px;

      color: var(--staff-ink);

      font-size: clamp(27px, 3vw, 35px);
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: -.038em;

      text-align: left;
    }

    body.staff-login .sub {
      max-width: 58ch;

      margin: 0;

      color: var(--staff-muted);

      font-size: 14px;
      line-height: 1.65;

      text-align: left;
    }

    /* =========================================================
       SECURE CHIP
    ========================================================= */

    body.staff-login .secure-chip {
      flex: 0 0 auto;

      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 9px 12px;

      border: 1px solid var(--staff-line);
      border-radius: 14px;

      background: #f8fafc;

      color: #475569;

      font-size: 11.5px;
      font-weight: 650;

      white-space: nowrap;
    }

    body.staff-login .secure-chip-icon {
      width: 29px;
      height: 29px;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: #eaf2ff;
      color: var(--staff-accent);
    }

    body.staff-login .secure-chip-icon i {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================================================
       FORM
    ========================================================= */

    body.staff-login form {
      display: grid;
      gap: 18px;
    }

    body.staff-login .row {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 17px;
    }

    /* =========================================================
       FIELD
    ========================================================= */

    body.staff-login .field {
      min-width: 0;

      padding: 0;
      margin: 0;

      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.staff-login .field:focus-within {
      animation: staff-field-tilt .48s cubic-bezier(.2, .8, .2, 1);
    }

    @keyframes staff-field-tilt {
      0%, 100% { transform: rotate(0); }
      28% { transform: rotate(-.55deg) translateY(-1px); }
      58% { transform: rotate(.45deg); }
      80% { transform: rotate(-.2deg); }
    }

    body.staff-login .field label {
      display: block;

      margin: 0 0 8px 2px;

      color: var(--staff-text);

      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    body.staff-login .field input:not([type="checkbox"]) {
      width: 100%;
      height: 55px;

      box-sizing: border-box;

      padding: 0 16px;

      border: 1px solid #dbe2ea;
      border-radius: 15px;

      outline: none;

      background: var(--staff-input);

      color: var(--staff-ink);

      font-family: inherit;
      font-size: 15px;
      line-height: 1;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.8),
        0 1px 2px rgba(15,23,42,.025);

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease,
        transform .2s ease;
    }

    body.staff-login .field input:not([type="checkbox"])::placeholder {
      color: var(--staff-placeholder);
      opacity: 1;
    }

    body.staff-login .field input:not([type="checkbox"]):hover {
      border-color: #cbd5e1;
      background: #fff;
    }

    body.staff-login .field input:not([type="checkbox"]):focus {
      border-color: #60a5fa;

      background: #fff;

      box-shadow:
        0 0 0 4px rgba(37, 99, 235, .09),
        0 6px 18px rgba(37, 99, 235, .05);
    }

    /* =========================================================
       PASSWORD
    ========================================================= */

    body.staff-login .pw {
      position: relative;
    }

    body.staff-login .pw input {
      padding-right: 60px !important;
    }

    body.staff-login .eye {
      position: absolute;
      top: 6px;
      right: 6px;

      width: 43px;
      height: 43px;

      display: grid;
      place-items: center;

      padding: 0;

      border: 0;
      border-radius: 11px;

      background: transparent;
      color: #64748b;

      cursor: pointer;

      transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
    }

    body.staff-login .eye:hover {
      background: #eef2f7;
      color: #1e293b;
    }

    body.staff-login .eye:active {
      transform: scale(.94);
    }

    body.staff-login .eye:focus-visible {
      outline: none;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, .12);
    }

    /* =========================================================
       REQUIRED HINT
    ========================================================= */

    body.staff-login .required-hint {
      display: block;

      margin: 7px 0 0 2px;

      color: #94a3b8;

      font-size: 11.5px;
      line-height: 1.4;
    }

    /* =========================================================
       VALIDATION
    ========================================================= */

    body.staff-login .err {
      min-height: 0;

      margin: 5px 0 0 2px;

      color: var(--staff-danger);

      font-size: 12px;
      line-height: 1.45;
    }

    body.staff-login .err:empty {
      display: none;
    }

    body.staff-login .invalid input:not([type="checkbox"]) {
      border-color: #f87171 !important;

      background: #fffafa;

      box-shadow:
        0 0 0 4px rgba(220, 38, 38, .07) !important;
    }

    /* =========================================================
       REMEMBER / FORGOT
    ========================================================= */

    body.staff-login .between {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin: 2px 0 0;
      padding: 0;
    }

    body.staff-login .chk {
      display: inline-flex;
      align-items: center;

      gap: 9px;

      padding: 0;

      border: 0;
      background: none;

      color: #475569;

      font-size: 13px;
      line-height: 1.4;
      font-weight: 550;

      cursor: pointer;
      user-select: none;
    }

    body.staff-login .chk input {
      width: 18px;
      height: 18px;

      flex: 0 0 auto;

      margin: 0;

      accent-color: var(--staff-accent);

      cursor: pointer;
    }

    body.staff-login .between a {
      color: var(--staff-accent);

      font-size: 13px;
      font-weight: 700;

      text-decoration: none;

      transition: color .18s ease;
    }

    body.staff-login .between a:hover {
      color: var(--staff-accent-dark);

      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* =========================================================
       FORM MESSAGE
    ========================================================= */

    body.staff-login .form-msg {
      min-height: 0;

      margin: 0;
      padding: 12px 14px;

      border: 1px solid rgba(220, 38, 38, .16);
      border-radius: 13px;

      background: #fff7f7;

      color: #991b1b;

      font-size: 13px;
      line-height: 1.5;
    }

    body.staff-login .form-msg:empty {
      display: none;
    }

    body.staff-login .form-msg.success {
      border-color: rgba(5, 150, 105, .16);

      background: #f0fdf9;

      color: var(--staff-success);
    }

    /* =========================================================
       LOGIN BUTTON
    ========================================================= */

    body.staff-login .btn {
      width: 100%;
      height: 55px;

      box-sizing: border-box;

      border: 1px solid var(--staff-accent-dark);
      border-radius: 15px;

      background:
        linear-gradient(
          180deg,
          #3b82f6 0%,
          #2563eb 100%
        );

      color: #fff;

      font-family: inherit;
      font-size: 15px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: .01em;

      box-shadow:
        0 11px 24px rgba(37, 99, 235, .18),
        inset 0 1px 0 rgba(255,255,255,.18);

      cursor: pointer;

      transition:
        transform .16s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    body.staff-login .btn:hover {
      filter: brightness(1.02);

      transform: translateY(-1px);

      box-shadow:
        0 15px 30px rgba(37, 99, 235, .22),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    body.staff-login .btn:active {
      transform: translateY(0);

      box-shadow:
        0 7px 15px rgba(37, 99, 235, .15);
    }

    body.staff-login .btn:focus-visible {
      outline: none;

      box-shadow:
        0 0 0 4px rgba(37, 99, 235, .14),
        0 11px 24px rgba(37, 99, 235, .18);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    body.staff-login .center {
      margin: 18px 0 0;

      color: #64748b;

      font-size: 12.5px;
      line-height: 1.6;

      text-align: center;
    }

    body.staff-login .lockline {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      margin-top: 20px;
      padding-top: 17px;

      border-top: 1px solid var(--staff-line-soft);

      color: #94a3b8;

      font-size: 11.5px;
      line-height: 1.5;

      text-align: center;
      letter-spacing: .01em;
    }

    body.staff-login .lockline i {
      color: #64748b;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 760px) {
      body.staff-login .auth {
        padding: 18px;
      }

      body.staff-login .auth-card {
        padding: 27px 22px 23px;
        border-radius: 25px;
      }

      body.staff-login .login-heading {
        display: block;
        margin-bottom: 25px;
      }

      body.staff-login .secure-chip {
        margin-top: 16px;
      }

      body.staff-login .row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      body.staff-login .auth {
        align-items: flex-start;
        padding: 12px;
      }

      body.staff-login .auth-card {
        width: 100%;

        margin-top: 7px;

        padding: 23px 17px 20px;

        border-radius: 22px;
      }

      body.staff-login .auth-header {
        align-items: flex-start;

        margin-bottom: 23px;
      }

      body.staff-login .management-badge {
        padding: 7px 9px;

        font-size: 9.5px;
      }

      body.staff-login h1 {
        font-size: 25px;
      }

      body.staff-login .sub {
        font-size: 13.5px;
      }

      body.staff-login .between {
        align-items: flex-start;
        flex-direction: column;

        gap: 11px;
      }

      body.staff-login .field input:not([type="checkbox"]) {
        height: 53px;
      }

      body.staff-login .btn {
        height: 53px;
      }

      body.staff-login .lockline {
        padding-left: 8px;
        padding-right: 8px;
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      body.staff-login .auth-card,
      body.staff-login .back,
      body.staff-login .eye,
      body.staff-login .btn,
      body.staff-login .field:focus-within {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body class="staff staff-login">

  <main class="auth">

    <section class="panel">

      <div class="card auth-card">

        <!-- =================================================
             HEADER
        ================================================== -->

        <div class="auth-header">

          <a
            class="back"
            data-route="gateway"
            href="/pages/auth/index.html"
          >
            <i data-i="left"></i>
            <span>Quay lại chọn khu vực</span>
          </a>

          <span class="management-badge">
            Quản trị cửa hàng
          </span>

        </div>

        <!-- =================================================
             HEADING
        ================================================== -->

        <div class="login-heading">

          <div class="login-heading-main">

            <h1 id="management-login-title">
              Đăng nhập quản trị
            </h1>

            <p
              id="management-login-description"
              class="sub"
            >
              Dành cho chủ cửa hàng hoặc nhân viên đã được cấp tài khoản.
            </p>

          </div>

          <div class="secure-chip">

            <span class="secure-chip-icon">
              <i data-i="lock"></i>
            </span>

            <span>
              Phiên đăng nhập bảo mật
            </span>

          </div>

        </div>

        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <form
          data-endpoint="/api/auth/staff/login"
          data-login-role="MANAGEMENT"
          novalidate
        >

          <div class="row">

            <!-- ACCOUNT -->

            <div class="field">

              <label for="account">
                Tài khoản
              </label>

              <input
                id="account"
                name="account"
                autocomplete="username"
                placeholder="Email / Số điện thoại / Tên đăng nhập"
                data-v="required"
                data-required-message="Vui lòng nhập tài khoản."
              >

              <small class="required-hint">
                Thông tin bắt buộc
              </small>

              <p class="err"></p>

            </div>

            <!-- PASSWORD -->

            <div class="field">

              <label for="password">
                Mật khẩu
              </label>

              <div class="pw">

                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Nhập mật khẩu"
                  data-v="required"
                  data-required-message="Vui lòng nhập mật khẩu."
                >

                <button
                  type="button"
                  class="eye"
                  aria-label="Hiện mật khẩu"
                >
                  <i data-i="eye"></i>
                </button>

              </div>

              <small class="required-hint">
                Thông tin bắt buộc
              </small>

              <p class="err"></p>

            </div>

          </div>

          <!-- OPTIONS -->

          <div class="between">

            <label class="chk">

              <input
                type="checkbox"
                name="remember"
              >

              <span>
                Ghi nhớ đăng nhập
              </span>

            </label>

            <a
              data-route="staff.forgot"
              href="forgot-password.html"
            >
              Quên mật khẩu?
            </a>

          </div>

          <!-- FORM MESSAGE -->

          <p
            class="form-msg"
            role="alert"
          ></p>

          <!-- SUBMIT -->

          <button
            class="btn"
            type="submit"
          >
            Đăng nhập
          </button>

        </form>

        <!-- =================================================
             INFORMATION
        ================================================== -->

        <p
          class="center"
          style="margin-top:18px"
        >
          Tài khoản cửa hàng được cấp bởi quản trị viên.
        </p>

        <p class="lockline">

          <i data-i="lock"></i>

          <span>
            Chỉ dành cho tài khoản được cấp quyền
          </span>

        </p>

      </div>

    </section>

  </main>

  <!-- =======================================================
       EXISTING APPLICATION SCRIPTS
  ======================================================== -->

  <script src="../../../assets/js/core/routes.js"></script>
  <script src="../../../assets/js/core/app.js"></script>

</body>
</html>
