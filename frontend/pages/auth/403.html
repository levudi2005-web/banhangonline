<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <title>Không có quyền truy cập — BanHangOnline</title>
</head>
<body class="customer" data-auth-mode="forbidden">
  <main class="auth">
    <section class="panel">
      <div class="card auth-card error-card" aria-labelledby="forbidden-title">
        <span class="error-code" aria-hidden="true">403</span>
        <h1 id="forbidden-title">Không có quyền truy cập</h1>
        <p id="forbidden-status" class="sub" role="status">Đang kiểm tra phiên đăng nhập…</p>
        <div class="actions">
          <a id="return-home" class="btn" href="/">Về khu vực của tôi</a>
          <a id="logout-link" class="btn ghost" href="/dang-xuat?area=customer">Đăng xuất</a>
        </div>
      </div>
    </section>
  </main>
  <script src="../../assets/js/core/routes.js"></script>
</body>
</html>
